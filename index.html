<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F4ED">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Claude Guide">
  <title>Claude Code for Non-Coders</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #F7F4ED;
      color: #22201B;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { text-align: center; padding: 28px; }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border: 2px solid #B5761F;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #B5761F;
      font-size: 26px;
      font-weight: 700;
    }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; color: #5C574C; font-size: 14px; }
    a { color: #B5761F; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CC</div>
    <h1>Claude Code for Non-Coders</h1>
    <p id="status">Opening the reader…</p>
    <noscript><p><a href="./Claude%20Code%20Guide%20-%20Interactive%20Reader.html">Open the reader</a></p></noscript>
  </main>
  <script>
    (function () {
      var reader = './Claude%20Code%20Guide%20-%20Interactive%20Reader.html';
      function openReader() { window.location.replace(reader); }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(function () { return navigator.serviceWorker.ready; })
          .catch(function () {
            document.getElementById('status').textContent = 'Opening without offline mode…';
          })
          .finally(openReader);
      } else {
        openReader();
      }
    })();
  </script>
</body>
</html>
